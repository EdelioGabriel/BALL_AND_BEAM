[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

upload_speed = 921600
monitor_speed = 115200

lib_deps =
    pololu/VL53L0X @ ^1.3.1
    madhephaestus/ESP32Servo @ ^3.0.6
